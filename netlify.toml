# Netlify = production pipeline for the CUSTOM DOMAIN.
#   NS1 DNS: afaregister.com / www.afaregister.com → 35.157.26.135 /
#   63.176.8.218 (Netlify), apex 301 → www → 200. Verified live.
# GitHub Pages = mirror at cyberblackout.github.io, deployed by
#   .github/workflows/deploy.yml. Two independent pipelines are live;
#   both run `npm run build` so the mirrors stay identical.
# Division of labour:
#   - This file supplies the SPA fallback (/* → /index.html) AND the
#     security headers GitHub Pages cannot set (X-Frame-Options,
#     X-Content-Type-Options, Referrer-Policy, Permissions-Policy,
#     HSTS, full CSP). The GH Pages mirror carries only the meta CSP
#     in index.html plus GitHub's HSTS — that header gap is expected
#     and tracked, not a regression here.
#   - GH Pages SPA fallback lives in public/404.html; its CSP is the
#     <meta> tag in index.html (both are base-path aware).

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co https://cdn.paystack.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://api.resend.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://js.paystack.co https://paystack.co https://*.paystack.co https://checkout.paystack.com https://paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'"
