# RETIRED — Netlify is no longer the production target.
# Canonical deployment is GitHub Pages (.github/workflows/deploy.yml), which cannot
# read this file: its SPA fallback lives in public/404.html and its CSP in index.html.
# This file is kept only so https://afa-register.netlify.app (fallback mirror) can
# still be rebuilt with the same security headers. Delete it together with the mirror.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co https://cdn.paystack.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.paystack.co https://api.resend.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://js.paystack.co https://paystack.co https://*.paystack.co https://checkout.paystack.com https://paystack.com; object-src 'none'; base-uri 'self'; form-action 'self'"
